server:
  port: 8888

spring:
  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config

  security:
    user:
      name: ${CONFIG_USER:admin}
      password: ${CONFIG_PASSWORD:change-me-in-production}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:change-me-in-production@localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh