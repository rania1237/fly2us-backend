server:
  port: 8083

spring:
  application:
    name: payment-service

  cloud:
    config:
      enabled: false

  datasource:
    url: ${DB_PAYMENT_URL:jdbc:mysql://localhost:3306/fly2us_payments?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ==========================================
  # Mailtrap (config via variables d'environnement)
  # ==========================================
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:change-me-in-production@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_xxx}

logging:
  level:
    fly2us.tn.payment: INFO

management:
  health:
    mail:
      enabled: false