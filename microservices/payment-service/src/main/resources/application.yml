server:
  port: 8083

spring:
  application:
    name: payment-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/fly2us_payments?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

