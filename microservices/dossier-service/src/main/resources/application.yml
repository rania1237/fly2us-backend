server:
  port: 8082

spring:
  application:
    name: dossier-service
  cloud:
    config:
      enabled: false

  datasource:
    url: ${DB_DOSSIER_URL:jdbc:mysql://localhost:3306/fly2us_dossiers?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:change-me-in-production@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

dossier:
  status:
    default: EN_ATTENTE_DOCUMENTS
  expiration-days: 30

logging:
  level:
    fly2us.tn.dossier: INFO