server:
  port: 8081

spring:
  application:
    name: user-service
  cloud:
    config:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fly2us_users?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://eureka:change-me-in-production@localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    fly2us.tn.user: INFO
    org.hibernate.SQL: WARN